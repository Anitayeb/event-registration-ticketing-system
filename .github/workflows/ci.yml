name: CI/CD - Event Registration & Ticketing Backend

# Runs tests on every push/PR to any branch, and deploys automatically
# only when changes land on main.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'chore/**'

  pull_request:
    branches:
      - develop
      - main


permissions:
  id-token: write   # needed for OIDC auth to AWS (no long-lived secrets)
  contents: read

jobs:

  # ---------------------------------------------------------------
  # Job 1: Lint + Unit Test (runs on every push and PR)
  # ---------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 lambda/ --max-line-length=110 --extend-ignore=E203

      - name: Check formatting with black
        run: |
          black --check lambda/ tests/

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------
  # Job 2: Validate the SAM template (runs on every push and PR)
  # ---------------------------------------------------------------
  validate:
    name: Validate SAM Template
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: SAM validate
        run: sam validate --lint

      - name: SAM build (catches packaging errors early)
        run: sam build

  # ---------------------------------------------------------------
  # Job 3: Deploy (only on push to main, after tests + validation pass)
  # ---------------------------------------------------------------
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    needs: [test, validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      api_url: ${{ steps.get-url.outputs.api_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli
      
      # Uses OIDC federation instead of long-lived AWS keys in secrets.
      # Requires an IAM role trust policy set up once (see PHASE3_CICD_GUIDE.md).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS Credentials
        run: |
          echo "AWS identity:"
          aws sts get-caller-identity
             echo "AWS Credentials are successfully."

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name Event-registration-ticketing-system \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3

      - name: Get deployed API URL
        id: get-url
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name Event-registration-ticketing-system \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"

      - name: Post-deploy smoke test
        run: |
          echo "Testing ${{ steps.get-url.outputs.api_url }}/events"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.get-url.outputs.api_url }}/events")
          if [ "$STATUS" -ne 200 ]; then
            echo "Smoke test failed: GET /events returned $STATUS"
            exit 1
          fi
          echo "Smoke test passed."

  # ---------------------------------------------------------------
  # Job 4: Deploy the frontend (only after the backend deploy + smoke
  # test succeed). Generates config.js from the real API URL so nobody
  # ever has to hand-edit it — this is the whole point of this job.
  # ---------------------------------------------------------------
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # The S3 bucket and CloudFront distribution are now resources inside
      # template.yaml itself (see the "Frontend: S3 + CloudFront" section),
      # so their real names come straight from this stack's own outputs —
      # no separate FRONTEND_BUCKET_NAME / CLOUDFRONT_DISTRIBUTION_ID
      # secrets to create or keep in sync.
      - name: Get frontend bucket + distribution from stack outputs
        id: get-frontend
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name Event-registration-ticketing-system \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name Event-registration-ticketing-system \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" \
            --output text)
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Generate config.js from the deployed API URL
        run: |
          cat > frontend/config.js << EOF
          // Auto-generated at $(date -u +"%Y-%m-%dT%H:%M:%SZ") by .github/workflows/ci.yml
          // Do not hand-edit — this file is overwritten on every deploy to main.
          window.APP_CONFIG = {
            apiBaseURL: "${{ needs.deploy.outputs.api_url }}"
          };
          EOF
          cat frontend/config.js

      - name: Sync frontend to S3
        run: |
          aws s3 sync frontend/ "s3://${{ steps.get-frontend.outputs.bucket }}/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.get-frontend.outputs.dist_id }}" \
            --paths "/*"
