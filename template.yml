AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Event Registration & Ticketing System
  Lambda + API Gateway + DynamoDB + Existing S3 + CloudFront

# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  FrontendBucketName:
    Type: String
    Default: regevents-event-ticketing-frontend-2026
    Description: Existing S3 bucket containing the frontend

# ==========================================================
# GLOBAL LAMBDA SETTINGS
# ==========================================================

Globals:

  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Tracing: Active

    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        REGISTRATIONS_TABLE: !Ref RegistrationsTable

# ==========================================================
# RESOURCES
# ==========================================================

Resources:

  # ========================================================
  # DYNAMODB - EVENTS
  # ========================================================

  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: Events
      BillingMode: PAY_PER_REQUEST

      SSESpecification:
        SSEEnabled: true

      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S

      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  # ========================================================
  # DYNAMODB - REGISTRATIONS
  # ========================================================

  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: Registrations
      BillingMode: PAY_PER_REQUEST

      SSESpecification:
        SSEEnabled: true

      AttributeDefinitions:
        - AttributeName: registrationId
          AttributeType: S

        - AttributeName: email
          AttributeType: S

      KeySchema:
        - AttributeName: registrationId
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: EmailIndex

          KeySchema:
            - AttributeName: email
              KeyType: HASH

          Projection:
            ProjectionType: ALL

  # ========================================================
  # API GATEWAY
  # ========================================================

  TicketingApi:
    Type: AWS::Serverless::Api

    Properties:
      StageName: prod

      Cors:
        AllowMethods: "'OPTIONS,POST,GET,DELETE'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ========================================================
  # REGISTER PARTICIPANT
  # POST /register
  # ========================================================

  RegisterFunction:
    Type: AWS::Serverless::Function

    Properties:
      Handler: registerParticipants.app.lambda_handler
      CodeUri: lambda/

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable

      Events:
        Register:
          Type: Api

          Properties:
            RestApiId: !Ref TicketingApi
            Path: /register
            Method: POST

  # ========================================================
  # LIST EVENTS
  # GET /events
  # ========================================================

  ListEventsFunction:
    Type: AWS::Serverless::Function

    Properties:
      Handler: getEvents.app.lambda_handler
      CodeUri: lambda/

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable

      Events:
        ListEvents:
          Type: Api

          Properties:
            RestApiId: !Ref TicketingApi
            Path: /events
            Method: GET

  # ========================================================
  # GET REGISTRATIONS
  # GET /registrations/{email}
  # ========================================================

  GetRegistrationsFunction:
    Type: AWS::Serverless::Function

    Properties:
      Handler: getRegistrations.app.lambda_handler
      CodeUri: lambda/

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RegistrationsTable

      Events:
        GetRegistrations:
          Type: Api

          Properties:
            RestApiId: !Ref TicketingApi
            Path: /registrations/{email}
            Method: GET

  # ========================================================
  # CANCEL REGISTRATION
  # DELETE /registration/{id}
  # ========================================================

  CancelRegistrationFunction:
    Type: AWS::Serverless::Function

    Properties:
      Handler: cancelRegistrations.app.lambda_handler
      CodeUri: lambda/

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable

      Events:
        CancelRegistration:
          Type: Api

          Properties:
            RestApiId: !Ref TicketingApi
            Path: /registration/{id}
            Method: DELETE

  # ========================================================
  # CLOUDFRONT ORIGIN ACCESS CONTROL
  # ========================================================

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl

    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-FrontendOAC'
        Description: OAC for frontend S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ========================================================
  # CLOUDFRONT DISTRIBUTION
  # ========================================================

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution

    Properties:
      DistributionConfig:

        Enabled: true

        DefaultRootObject: index.html

        # ==================================================
        # CUSTOM DOMAIN
        # ==================================================

        Aliases:
          - regevents.online
          - www.regevents.online

        # ==================================================
        # HTTPS CERTIFICATE
        # ==================================================

        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:748503131675:certificate/53bd44f4-505b-4d63-ae17-7fb9dfd73141
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        # ==================================================
        # S3 ORIGIN
        # ==================================================

        Origins:
          - Id: FrontendS3Origin

            DomainName: !Sub '${FrontendBucketName}.s3.${AWS::Region}.amazonaws.com'

            S3OriginConfig: {}

            OriginAccessControlId: !Ref FrontendOAC

        # ==================================================
        # DEFAULT CACHE BEHAVIOR
        # ==================================================

        DefaultCacheBehavior:

          TargetOriginId: FrontendS3Origin

          ViewerProtocolPolicy: redirect-to-https

          Compress: true

          AllowedMethods:
            - GET
            - HEAD

          CachedMethods:
            - GET
            - HEAD

          ForwardedValues:
            QueryString: false

            Cookies:
              Forward: none

        # ==================================================
        # PRICE CLASS
        # ==================================================

        PriceClass: PriceClass_100

        # ==================================================
        # SPA ERROR HANDLING
        # ==================================================

        CustomErrorResponses:

          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ========================================================
  # S3 BUCKET POLICY FOR CLOUDFRONT OAC
  # ========================================================

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:

      Bucket: !Ref FrontendBucketName

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowCloudFrontServicePrincipalReadOnly

            Effect: Allow

            Principal:
              Service: cloudfront.amazonaws.com

            Action:
              - s3:GetObject

            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${FrontendBucketName}/*'

            Condition:

              StringEquals:

                AWS:SourceArn:
                  !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  # ========================================================
  # API URL
  # ========================================================

  ApiUrl:
    Description: Base URL for the API

    Value:
      !Sub 'https://${TicketingApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  # ========================================================
  # DYNAMODB OUTPUTS
  # ========================================================

  EventsTableName:
    Description: Events DynamoDB table

    Value:
      !Ref EventsTable

  RegistrationsTableName:
    Description: Registrations DynamoDB table

    Value:
      !Ref RegistrationsTable

  # ========================================================
  # FRONTEND S3 BUCKET
  # ========================================================

  FrontendBucketName:
    Description: Existing S3 bucket containing the frontend

    Value:
      !Ref FrontendBucketName

  # ========================================================
  # CLOUDFRONT DISTRIBUTION ID
  # ========================================================

  FrontendDistributionId:
    Description: CloudFront distribution ID

    Value:
      !Ref FrontendDistribution

  # ========================================================
  # CLOUDFRONT DOMAIN
  # ========================================================

  FrontendDistributionDomain:
    Description: CloudFront distribution domain

    Value:
      !GetAtt FrontendDistribution.DomainName

  # ========================================================
  # FRONTEND HTTPS URL
  # ========================================================

  FrontendUrl:
    Description: Public HTTPS URL for the frontend

    Value:
      !Sub
        - 'https://${Domain}'
        - Domain: !GetAtt FrontendDistribution.DomainName