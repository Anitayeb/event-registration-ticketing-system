AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Event Registration & Ticketing System
  Lambda + API Gateway + DynamoDB + Existing S3 + CloudFront

# ==========================================================
# PARAMETERS
# ==========================================================

Parameters:

  FrontendBucketName:
    Type: String
    Default: regevents-event-ticketing-frontend-2026
    Description: Existing S3 bucket containing the frontend

  AlertEmail:
    Type: String
    Description: Email address for CloudWatch and budget alerts

  MonthlyBudgetLimitUSD:
    Type: Number
    Default: 5
    Description: Monthly AWS cost budget in USD
# ==========================================================
# GLOBAL LAMBDA SETTINGS
# ==========================================================

Globals:

  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Tracing: Active

    Environment:
      Variables:
        EVENTS_TABLE: !Ref EventsTable
        REGISTRATIONS_TABLE: !Ref RegistrationsTable

# ==========================================================
# RESOURCES
# ==========================================================

Resources:

  # ========================================================
  # DYNAMODB - EVENTS
  # ========================================================

  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: Events
      BillingMode: PAY_PER_REQUEST

      SSESpecification:
        SSEEnabled: true

      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S

      KeySchema:
        - AttributeName: eventId
          KeyType: HASH

  # ========================================================
  # DYNAMODB - REGISTRATIONS
  # ========================================================

  RegistrationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      TableName: Registrations
      BillingMode: PAY_PER_REQUEST

      SSESpecification:
        SSEEnabled: true

      AttributeDefinitions:
        - AttributeName: registrationId
          AttributeType: S

        - AttributeName: email
          AttributeType: S

      KeySchema:
        - AttributeName: registrationId
          KeyType: HASH

      GlobalSecondaryIndexes:
        - IndexName: EmailIndex

          KeySchema:
            - AttributeName: email
              KeyType: HASH

          Projection:
            ProjectionType: ALL

  # ========================================================
  # API GATEWAY
  # ========================================================

  TicketingApi:
    Type: AWS::Serverless::Api

    Properties:
      StageName: prod

      Cors:
        AllowMethods: "'OPTIONS,POST,GET,DELETE'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ========================================================
  # REGISTER PARTICIPANT
  # POST /register
  # ========================================================

  RegisterFunction:
    Type: AWS::Serverless::Function

    Properties:
      Handler: registerParticipants.app.lambda_handler
      CodeUri: lambda/

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable

      Events:
        Register:
          Type: Api

          Properties:
            RestApiId: !Ref TicketingApi
            Path: /register
            Method: POST

  # ========================================================
  # LIST EVENTS
  # GET /events
  # ========================================================

  ListEventsFunction:
    Type: AWS::Serverless::Function

    Properties:
      Handler: getEvents.app.lambda_handler
      CodeUri: lambda/

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable

      Events:
        ListEvents:
          Type: Api

          Properties:
            RestApiId: !Ref TicketingApi
            Path: /events
            Method: GET

  # ========================================================
  # GET REGISTRATIONS
  # GET /registrations/{email}
  # ========================================================

  GetRegistrationsFunction:
    Type: AWS::Serverless::Function

    Properties:
      Handler: getRegistrations.app.lambda_handler
      CodeUri: lambda/

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RegistrationsTable

      Events:
        GetRegistrations:
          Type: Api

          Properties:
            RestApiId: !Ref TicketingApi
            Path: /registrations/{email}
            Method: GET

  # ========================================================
  # CANCEL REGISTRATION
  # DELETE /registration/{id}
  # ========================================================

  CancelRegistrationFunction:
    Type: AWS::Serverless::Function

    Properties:
      Handler: cancelRegistrations.app.lambda_handler
      CodeUri: lambda/

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RegistrationsTable

        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable

      Events:
        CancelRegistration:
          Type: Api

          Properties:
            RestApiId: !Ref TicketingApi
            Path: /registration/{id}
            Method: DELETE

# ========================================================
  # SNS TOPIC FOR ALERTS
  # ========================================================

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${AWS::StackName}-alerts"
      DisplayName: Event Ticketing Alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
  
  # ============================================================
  # AWS BUDGET
  # ============================================================

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: EventRegistrationMonthlyBudget
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimitUSD
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
        CostTypes:
          IncludeCredit: false
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: false
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseAmortized: false
          UseBlended: false

      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

# ========================================================
 # C LOUDWATCH LAMBDA ERROR-RATE ALARMS
 # ========================================================

  RegisterFunctionErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-RegisterFunction-error-rate"
      AlarmDescription: Alarms when RegisterFunction error rate exceeds 5%
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic
      Metrics:
        - Id: errorRate
          Expression: "(errors / invocations) * 100"
          Label: ErrorRatePercent
          ReturnData: true
        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref RegisterFunction
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref RegisterFunction
            Period: 300
            Stat: Sum
          ReturnData: false

  ListEventsFunctionErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-ListEventsFunction-error-rate"
      AlarmDescription: Alarms when ListEventsFunction error rate exceeds 5%
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic
      Metrics:
        - Id: errorRate
          Expression: "(errors / invocations) * 100"
          Label: ErrorRatePercent
          ReturnData: true

        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ListEventsFunction
            Period: 300
            Stat: Sum
          ReturnData: false

        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value: !Ref ListEventsFunction
            Period: 300
            Stat: Sum
          ReturnData: false

  GetRegistrationsFunctionErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${AWS::StackName}-GetRegistrationsFunction-error-rate"
      AlarmDescription: Alarms when GetRegistrationsFunction error rate exceeds 5%
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlertsTopic
      OKActions:
        - Ref: AlertsTopic
      Metrics:
        - Id: errorRate
          Expression: "(errors / invocations) * 100"
          Label: ErrorRatePercent
          ReturnData: true

        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value:
                    Ref: GetRegistrationsFunction
            Period: 300
            Stat: Sum
          ReturnData: false

        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value:
                    Ref: GetRegistrationsFunction
            Period: 300
            Stat: Sum
          ReturnData: false

  CancelRegistrationFunctionErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName:
        Fn::Sub: "${AWS::StackName}-CancelRegistrationFunction-error-rate"
      AlarmDescription: Alarms when CancelRegistrationFunction error rate exceeds 5%
      ComparisonOperator: GreaterThanThreshold
      Threshold: 5
      EvaluationPeriods: 1
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlertsTopic
      OKActions:
        - Ref: AlertsTopic

      Metrics:
        - Id: errorRate
          Expression: "(errors / invocations) * 100"
          Label: ErrorRatePercent
          ReturnData: true

        - Id: errors
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value:
                    Ref: CancelRegistrationFunction
            Period: 300
            Stat: Sum
          ReturnData: false

        - Id: invocations
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Invocations
              Dimensions:
                - Name: FunctionName
                  Value:
                    Ref: CancelRegistrationFunction
            Period: 300
            Stat: Sum
          ReturnData: false

# ========================================================
  #  LAMBDA DURATION ALARM
  # =======================================================

  RegisterFunctionDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-RegisterFunction-duration"
      AlarmDescription: Alarms when RegisterFunction average duration exceeds 8 seconds
      Namespace: AWS/Lambda
      MetricName: Duration
      Dimensions:
        - Name: FunctionName
          Value: !Ref RegisterFunction
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 8000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # ========================================================
  # API GATEWAY 5XX ERROR ALARM
  # ========================================================

  ApiGateway5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx-errors"
      AlarmDescription: Alarms when API Gateway returns 5xx errors
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Ref TicketingApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  # ========================================================
  # CLOUDFRONT ORIGIN ACCESS CONTROL
  # ========================================================

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl

    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-FrontendOAC'
        Description: OAC for frontend S3 bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ========================================================
  # CLOUDFRONT DISTRIBUTION
  # ========================================================

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution

    Properties:
      DistributionConfig:

        Enabled: true

        DefaultRootObject: index.html

        # ==================================================
        # CUSTOM DOMAIN
        # ==================================================

        Aliases:
          - regevents.online
          - www.regevents.online

        # ==================================================
        # HTTPS CERTIFICATE
        # ==================================================

        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:748503131675:certificate/53bd44f4-505b-4d63-ae17-7fb9dfd73141
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        # ==================================================
        # S3 ORIGIN
        # ==================================================

        Origins:
          - Id: FrontendS3Origin

            DomainName: !Sub '${FrontendBucketName}.s3.${AWS::Region}.amazonaws.com'

            S3OriginConfig: {}

            OriginAccessControlId: !Ref FrontendOAC

        # ==================================================
        # DEFAULT CACHE BEHAVIOR
        # ==================================================

        DefaultCacheBehavior:

          TargetOriginId: FrontendS3Origin

          ViewerProtocolPolicy: redirect-to-https

          Compress: true

          AllowedMethods:
            - GET
            - HEAD

          CachedMethods:
            - GET
            - HEAD

          ForwardedValues:
            QueryString: false

            Cookies:
              Forward: none

        # ==================================================
        # PRICE CLASS
        # ==================================================

        PriceClass: PriceClass_100

        # ==================================================
        # SPA ERROR HANDLING
        # ==================================================

        CustomErrorResponses:

          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ========================================================
  # S3 BUCKET POLICY FOR CLOUDFRONT OAC
  # ========================================================

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy

    Properties:

      Bucket: !Ref FrontendBucketName

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: AllowCloudFrontServicePrincipalReadOnly

            Effect: Allow

            Principal:
              Service: cloudfront.amazonaws.com

            Action:
              - s3:GetObject

            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${FrontendBucketName}/*'

            Condition:

              StringEquals:

                AWS:SourceArn:
                  !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

# ==========================================================
# OUTPUTS
# ==========================================================

Outputs:

  # ========================================================
  # API URL
  # ========================================================

  ApiUrl:
    Description: Base URL for the API

    Value:
      !Sub 'https://${TicketingApi}.execute-api.${AWS::Region}.amazonaws.com/prod'

  # ========================================================
  # DYNAMODB OUTPUTS
  # ========================================================

  EventsTableName:
    Description: Events DynamoDB table

    Value:
      !Ref EventsTable

  RegistrationsTableName:
    Description: Registrations DynamoDB table

    Value:
      !Ref RegistrationsTable

  # ========================================================
  # FRONTEND S3 BUCKET
  # ========================================================

  FrontendBucketName:
    Description: Existing S3 bucket containing the frontend

    Value:
      !Ref FrontendBucketName

  # ========================================================
  # CLOUDFRONT DISTRIBUTION ID
  # ========================================================

  FrontendDistributionId:
    Description: CloudFront distribution ID

    Value:
      !Ref FrontendDistribution

  # ========================================================
  # CLOUDFRONT DOMAIN
  # ========================================================

  FrontendDistributionDomain:
    Description: CloudFront distribution domain

    Value:
      !GetAtt FrontendDistribution.DomainName

  # ========================================================
  # FRONTEND HTTPS URL
  # ========================================================

  FrontendUrl:
    Description: Public HTTPS URL for the frontend

    Value:
      !Sub
        - 'https://${Domain}'
        - Domain: !GetAtt FrontendDistribution.DomainName

  SNSTopicArn:
    Description: SNS topic ARN used for CloudWatch alerts
    Value: !Ref AlertsTopic
    Export:
      Name: !Sub "${AWS::StackName}-SNSTopicArn"

  MonthlyBudgetName:
    Description: AWS monthly cost budget name
    Value: !Ref MonthlyCostBudget
    Export:
      Name: !Sub "${AWS::StackName}-MonthlyBudgetName"

  AlertEmail:
    Description: Email address receiving monitoring and budget notifications
    Value: !Ref AlertEmail